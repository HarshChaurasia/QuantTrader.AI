[project]
name = "ea"
version = "0.1.0"
description = "Multi-asset swing trading system (US stocks, crypto, forex) with LLM-augmented news analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Harsh Chaurasia" }]

dependencies = [
    # Broker SDKs
    "alpaca-py>=0.30.0",
    "oandapyV20>=0.7.2",
    # LLM (multiple providers; user picks one in config)
    "anthropic>=0.40.0",
    "google-genai>=1.0",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Data
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    # HTTP / async
    "httpx>=0.27",
    "aiohttp>=3.10",
    "websockets>=12.0",
    # Logging
    "loguru>=0.7",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # News / market data helpers
    "feedparser>=6.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Monitoring (Phase A.2 dashboard)
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
research = [
    # Used only for fast strategy parameter sweeps; live/backtest use the custom event-driven engine
    "vectorbt>=0.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
ea = "ea.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
